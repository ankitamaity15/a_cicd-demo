name: Security Scan

description: Scan Terraform code for security vulnerabilities

runs:
  using: composite

  steps:
    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.3

    - name: Run Trivy IaC Scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: config
        scan-ref: .
        format: table
        exit-code: 1
        severity: HIGH,CRITICAL
