name: Data Load

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to load data into
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod

jobs:
  data-load:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python

      - name: Load data into Snowflake
        run: |
          python - <<'PY'
          import os
          print(f"Loading data into Snowflake for environment: {os.getenv('ENVIRONMENT', 'dev')}")
          PY
