name: Terraform Apply

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_INPUT: "false"

      ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}

      TF_VAR_environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'dev' }}

      TF_VAR_organization_name: "TEST"
      TF_VAR_account_name: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      TF_VAR_user: ${{ secrets.SNOWFLAKE_USER }}
      TF_VAR_password: ${{ secrets.SNOWFLAKE_PASSWORD }}
      TF_VAR_role: ${{ secrets.SNOWFLAKE_ROLE }}
      TF_VAR_warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Debug Snowflake Variables
        run: |
          echo "ORG SET: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME != '' }}"
          echo "ACCOUNT SET: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME != '' }}"
          echo "USER SET: ${{ secrets.SNOWFLAKE_USER != '' }}"
          echo "ROLE SET: ${{ secrets.SNOWFLAKE_ROLE != '' }}"
          echo "WAREHOUSE SET: ${{ secrets.SNOWFLAKE_WAREHOUSE != '' }}"
      - name: Debug Secrets
        run: |
          echo "ORG secret present: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME != '' }}"
          echo "ACCOUNT secret present: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME != '' }}"

      - name: Verify Environment Variables
        run: |
          if [ -z "$TF_VAR_organization_name" ]; then
            echo "ERROR: TF_VAR_organization_name is empty"
            exit 1
          fi

          if [ -z "$TF_VAR_account_name" ]; then
            echo "ERROR: TF_VAR_account_name is empty"
            exit 1
          fi

          if [ -z "$TF_VAR_user" ]; then
            echo "ERROR: TF_VAR_user is empty"
            exit 1
          fi

          echo "Required Terraform variables are present"

      - name: Prepare state directory
        run: mkdir -p ../tfstate

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="path=../tfstate/${{ env.ENVIRONMENT }}_cicd_demo-${{ env.ENVIRONMENT }}.tfstate"

      - name: Terraform Validate
        run: 
