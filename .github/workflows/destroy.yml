name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    environment: dev

    defaults:
      run:
        working-directory: terraform

    env:
      TF_INPUT: "false"

      TF_VAR_environment: dev

      TF_VAR_organization_name: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
      TF_VAR_account_name: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
      TF_VAR_user: ${{ secrets.SNOWFLAKE_USER }}
      TF_VAR_password: ${{ secrets.SNOWFLAKE_PASSWORD }}
      TF_VAR_role: ${{ secrets.SNOWFLAKE_ROLE }}
      TF_VAR_warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: |
          terraform init \
            -input=false \
            -backend-config="path=../tfstate/dev_cicd_demo-dev.tfstate"

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -input=false \
            -var="environment=dev" \
            -var-file="environments/dev/terraform.tfvars" \
            -auto-approve
